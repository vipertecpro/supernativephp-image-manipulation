name: Update Dependencies

on:
  schedule:
    # Run daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      # Only configure license auth when the secrets are actually set —
      # passing empty credentials makes composer fail. All current deps
      # resolve from public GitHub dists, so auth is optional.
      - name: Configure Composer Auth
        env:
          NATIVEPHP_LICENSE_EMAIL: ${{ secrets.NATIVEPHP_LICENSE_EMAIL }}
          NATIVEPHP_LICENSE_KEY: ${{ secrets.NATIVEPHP_LICENSE_KEY }}
        run: |
          if [ -n "$NATIVEPHP_LICENSE_EMAIL" ] && [ -n "$NATIVEPHP_LICENSE_KEY" ]; then
            composer config --global http-basic.nativephp.composer.sh "$NATIVEPHP_LICENSE_EMAIL" "$NATIVEPHP_LICENSE_KEY"
          else
            echo "No NativePHP license secrets configured — continuing without auth."
          fi

      - name: Update Composer Dependencies
        run: composer update --no-interaction --no-progress

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet composer.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Update dependencies

          Automated daily dependency update:
          - composer update"
          git push
